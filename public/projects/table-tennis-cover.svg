<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <title>Real-time table tennis integration</title>
  <desc>Provider schedules and match data feed transactional synchronisation, then live scores, settlement and publishing. Reconstructed from the case study, not an internal system diagram.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#047857" stroke-width="2"/></marker></defs>
  <rect width="960" height="600" fill="#ecfdf5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="65" font-size="28" font-weight="700" fill="#047857">TABLE TENNIS / LIVE DATA</text>
    <text x="48" y="118" font-size="42" font-weight="700" fill="#064e3b">From provider data to live trading.</text>
    <rect x="48" y="170" width="250" height="215" rx="20" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="72" y="214" font-size="25" fill="#047857">01 / INGEST</text>
    <text x="72" y="270" font-size="32" font-weight="700" fill="#064e3b">Provider APIs</text>
    <text x="72" y="314" font-size="25" fill="#375e50">Paginated schedules</text>
    <text x="72" y="351" font-size="25" fill="#375e50">Match data</text>
    <rect x="355" y="170" width="250" height="215" rx="20" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="379" y="214" font-size="25" fill="#047857">02 / SYNCHRONISE</text>
    <text x="379" y="270" font-size="32" font-weight="700" fill="#064e3b">Transactions</text>
    <text x="379" y="314" font-size="25" fill="#375e50">Schedules + scores</text>
    <text x="379" y="351" font-size="25" fill="#375e50">Multi-round format</text>
    <rect x="662" y="170" width="250" height="215" rx="20" fill="#064e3b"/>
    <text x="686" y="214" font-size="25" fill="#a7f3d0">03 / OPERATE</text>
    <text x="686" y="270" font-size="32" font-weight="700" fill="#fff">Trading UI</text>
    <text x="686" y="314" font-size="25" fill="#d1fae5">React + WebSockets</text>
    <text x="686" y="351" font-size="25" fill="#d1fae5">Near-real-time data</text>
    <path d="M300 276H340 M607 276H647 M787 388V448" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="48" y="465" width="864" height="92" rx="18" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="480" y="520" text-anchor="middle" font-size="30" font-weight="700" fill="#064e3b">Live scores · Selection settlement · Publishing</text>
  </g>
</svg>
