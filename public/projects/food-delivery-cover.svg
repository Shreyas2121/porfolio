<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <title>Food Delivery Platform order lifecycle</title>
  <desc>Menu customisation and coupons lead to delivery-zone validation and either Razorpay or cash-on-delivery checkout. Administrators manage the catalogue, orders and fulfilment. Illustrated workflow, not a product screenshot.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#c2410c" stroke-width="2"/></marker></defs>
  <rect width="960" height="600" fill="#fff7ed"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="65" font-size="28" font-weight="700" fill="#c2410c">FOOD DELIVERY / ORDER LIFECYCLE</text>
    <text x="48" y="118" font-size="42" font-weight="700" fill="#431407">Customise. Validate. Fulfil.</text>
    <rect x="48" y="173" width="250" height="176" rx="20" fill="#fff" stroke="#fdba74" stroke-width="2"/>
    <text x="72" y="220" font-size="31" font-weight="700" fill="#431407">Menu + cart</text>
    <text x="72" y="270" font-size="26" fill="#785442">Configurable add-ons</text>
    <text x="72" y="310" font-size="26" fill="#785442">Coupons</text>
    <rect x="355" y="173" width="250" height="176" rx="20" fill="#fff" stroke="#fdba74" stroke-width="2"/>
    <text x="379" y="220" font-size="31" font-weight="700" fill="#431407">Delivery zone</text>
    <text x="379" y="270" font-size="26" fill="#785442">Address validation</text>
    <text x="379" y="310" font-size="26" fill="#785442">Supported pincodes</text>
    <rect x="662" y="173" width="250" height="176" rx="20" fill="#7c2d12"/>
    <text x="686" y="220" font-size="31" font-weight="700" fill="#fff">Checkout</text>
    <text x="686" y="270" font-size="26" fill="#ffedd5">Razorpay</text>
    <text x="686" y="310" font-size="26" fill="#ffedd5">Cash on delivery</text>
    <path d="M300 259H340 M607 259H647 M787 353V419H480V445" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="48" y="465" width="864" height="92" rx="18" fill="#fff" stroke="#fdba74" stroke-width="2"/>
    <text x="480" y="503" text-anchor="middle" font-size="29" font-weight="700" fill="#431407">Administration + fulfilment</text>
    <text x="480" y="540" text-anchor="middle" font-size="26" fill="#785442">Catalogue · Orders · Promotions · Analytics</text>
  </g>
</svg>
