<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <title>Resilient external data services</title>
  <desc>Concurrency control, shared memory and Redis token caches, pre-expiry refresh and rate-aware retries reduce duplicate authentication. Heartbeat-triggered resynchronisation recovers downstream state. Reconstructed overview of the described patterns.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b45309" stroke-width="2"/></marker></defs>
  <rect width="960" height="600" fill="#fffbeb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="65" font-size="28" font-weight="700" fill="#b45309">EXTERNAL SERVICES / RELIABILITY</text>
    <text x="48" y="118" font-size="42" font-weight="700" fill="#451a03">Shared tokens. Recoverable state.</text>
    <rect x="48" y="176" width="250" height="215" rx="20" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="72" y="224" font-size="29" font-weight="700" fill="#451a03">Concurrent</text>
    <text x="72" y="261" font-size="29" font-weight="700" fill="#451a03">requests</text>
    <path d="M72 284H274" stroke="#fcd34d" stroke-width="2"/>
    <text x="72" y="324" font-size="25" fill="#78573a">Concurrency control</text>
    <text x="72" y="360" font-size="25" fill="#78573a">Avoid duplicate auth</text>
    <rect x="355" y="176" width="250" height="215" rx="20" fill="#78350f"/>
    <text x="379" y="224" font-size="29" font-weight="700" fill="#fff">Token cache</text>
    <text x="379" y="273" font-size="27" fill="#fef3c7">Memory + Redis</text>
    <path d="M379 296H581" stroke="#d97706" stroke-width="2"/>
    <text x="379" y="340" font-size="25" fill="#fef3c7">Pre-expiry refresh</text>
    <rect x="662" y="176" width="250" height="215" rx="20" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="686" y="224" font-size="29" font-weight="700" fill="#451a03">Provider calls</text>
    <text x="686" y="273" font-size="27" fill="#78573a">OAuth 2.0</text>
    <path d="M686 296H888" stroke="#fcd34d" stroke-width="2"/>
    <text x="686" y="340" font-size="25" fill="#78573a">Rate-aware retries</text>
    <path d="M300 275H340 M607 275H647" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="48" y="455" width="864" height="102" rx="18" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="72" y="494" font-size="24" fill="#b45309">DOWNSTREAM RECOVERY</text>
    <text x="72" y="532" font-size="29" font-weight="700" fill="#451a03">Heartbeat gap → Resynchronise downstream state</text>
  </g>
</svg>
